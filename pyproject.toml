[project]
name = "confocal-laser-tools"
version = "1.0.0"
description = "光学谐振腔仿真结果绘图、数值对照和报告整理"
authors = [{name = "陈恪瑾 / U202413925 / 光电信息科学与工程202409班"}]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4", "PyYAML>=6,<7"]

[project.scripts]
laser-tools = "laser_tools.cli:main"

[dependency-groups]
build = ["pyinstaller>=6.10,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/python/laser_tools", "code/python/Python"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/uv.lock", "/code/python"]
