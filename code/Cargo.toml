[package]
name = "confocal-fox-li"
version = "0.1.0"
edition = "2024"
authors = ["陈恪瑾 <U202413925 光电信息科学与工程202409班>"]
description = "Rust numerical implementation of a symmetric confocal cavity"

[dependencies]
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
